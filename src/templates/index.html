<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>ACE Services — Opportunity Operations</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="ACE Services">
        <span class="brand-mark">ACE</span>
        <span class="brand-copy">
          <strong>ACE Services</strong>
          <span>Opportunity Operations</span>
        </span>
      </a>
      <div class="topbar-actions">
        <span class="mode mode-subtle" id="syncMode" data-mode="idle">Idle</span>
        <div class="btn-group">
          <button class="btn btn-secondary" id="demoOfflineBtn" onclick="runDemoSync('fixture')">Offline demo</button>
          <button class="btn btn-primary" id="demoLiveBtn" onclick="runDemoSync('live')">Live SAM.gov sync</button>
        </div>
      </div>
    </div>
  </header>

  <section class="sync-strip" id="syncSection">
    <div class="sync-inner" id="kpiSection">
      <div class="sync-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="demoStatus" role="status" aria-live="polite">Sync status: idle.</span>
        <span class="limits" id="demoLimits"></span>
      </div>
      <dl class="sync-stats" id="syncStats" aria-label="Counts reported by the last sync"></dl>
    </div>
  </section>

  <div class="app-shell">
    <aside class="opportunity-rail" id="opportunitiesSection" aria-labelledby="opportunitiesHeading">
      <div class="rail-head">
        <div>
          <div class="eyebrow">Pipeline</div>
          <h2 id="opportunitiesHeading">Opportunities</h2>
        </div>
        <span class="rail-count" id="opportunityCount">—</span>
      </div>

      <div class="rail-kpi">
        <strong id="kpiQualified">—</strong>
        <span id="kpiQualifiedNote">Not loaded yet</span>
      </div>

      <div class="filters">
        <label class="sr-only" for="projectSearch">Search opportunities</label>
        <input class="field" id="projectSearch" type="search" placeholder="Search opportunities" />
        <label class="sr-only" for="stateFilter">Filter by state</label>
        <select class="field" id="stateFilter" aria-label="Filter by state">
          <option value="">All states</option>
        </select>
      </div>

      <ul class="opportunity-list" id="projectList" role="listbox" aria-label="Qualified opportunities"></ul>
    </aside>

    <main class="workspace-panel">
      <div class="workspace" id="workspace" role="region" aria-label="Selected opportunity"></div>
    </main>
  </div>

  <section class="queue-panel" id="queueSection" aria-labelledby="queueHeading">
    <div class="queue-head">
      <div>
        <div class="eyebrow">Outbound workflow</div>
        <h2 id="queueHeading">Outreach queue</h2>
      </div>
      <div class="queue-meta">
        <span class="badge badge-danger badge-solid">NOT SENT</span>
        <button class="btn btn-secondary btn-sm" onclick="loadOutreachQueue()">Refresh</button>
      </div>
    </div>
    <div class="queue-note">Approved drafts are recorded here for review. This demo never sends email.</div>
    <div class="queue-body" id="outreachQueue" aria-live="polite">
      <p class="muted">Loading queue…</p>
    </div>
  </section>

  <script src="/static/app.js" defer></script>
</body>
</html>
