<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACE Review Workspace</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>ACE Opportunity Review</h1><p class="muted">Qualified construction opportunities → contractor matches → human review → outreach approval.</p>
      </div>
      <div class="grid">
        <aside class="panel">
          <h2>Opportunities</h2>
          <div class="toolbar"><input id="projectSearch" type="search" placeholder="Search opportunities" /><select id="stateFilter"><option value="">All states</option></select></div><ul id="projectList" class="project-list"></ul>
        </aside>

        <main class="panel">
          <div id="workspace"></div>
        </main>
      </div>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
