name: ACE Services CI

on:
  push:
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run tests in API container
        run: docker compose exec -T api python -m pytest -q

      - name: Shutdown
        if: always()
        run: docker compose down -v
